<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selecione uma empresa ou cadastre um novo CNPJ para gerenciar o patrimônio na Beesiness.">
    <title>Minhas empresas | Beesiness</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard/user/dashboard.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/Beesiness_logo.png') }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    {% include 'dashboard/user/header.html' %}

    <main class="workspace">
        <div class="container">
            <!-- Cabeçalho da página -->
            <section class="workspace-head">
                <div class="workspace-intro">
                    <span class="label">Painel do usuário</span>
                    <h1>Suas empresas.</h1>
                    <p>
                        Olá, <strong>{{ (current_user.fullname or '').split(' ')[0] }}</strong>.
                        Selecione uma organização para abrir o painel contábil ou cadastre um novo CNPJ.
                    </p>
                </div>

                <div class="workspace-actions">
                    <button id="newCompanyButton" class="btn-primary new_company" type="button">
                        <span>Registrar empresa</span>
                        <span class="btn-plus" aria-hidden="true">+</span>
                    </button>
                </div>
            </section>

            <!-- Barra de busca e contagem (exibida quando há empresas) -->
            <section class="workspace-toolbar" id="toolbar" hidden>
                <div class="search-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input
                        type="search"
                        id="companySearch"
                        class="search-input"
                        placeholder="Filtrar por nome ou CNPJ..."
                        aria-label="Filtrar empresas por nome ou CNPJ"
                    >
                </div>
                <span class="company-count" id="companyCount"></span>
            </section>

            <!-- Estado de carregamento (skeletons) -->
            <div id="loading" class="skeleton-grid" aria-live="polite" aria-label="Carregando empresas">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <!-- Lista / Grade de empresas -->
            <section class="companies-grid" id="resultado" aria-live="polite"></section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/dashboard/user/companies_data.js') }}"></script>
</body>

</html>
